<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Tribe City · Galway</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pirata+One&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0d0d0d;
        --cream: #f3ead7;
        --maroon: #7a1f2b;
        --gold: #e7b347;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: var(--cream); font-family: 'Bebas Neue', Impact, sans-serif; }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; }

      /* film-ish vignette over everything */
      #grade { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(20, 8, 0, 0.45) 100%); mix-blend-mode: multiply; }

      #loading, #title { position: fixed; inset: 0; display: grid; place-items: center; transition: opacity 0.8s; }
      #loading { background: #120d0a; z-index: 30; }
      #loading.done, #title.done { opacity: 0; pointer-events: none; }
      #loading p { font-size: 22px; letter-spacing: 2px; opacity: 0.85; }

      #title { z-index: 20; cursor: pointer; background: linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.55)); text-align: center; }
      #title h1 { font-family: 'Pirata One', serif; font-weight: 400; font-size: clamp(64px, 12vw, 150px); margin: 0; line-height: 0.9; color: var(--cream); text-shadow: 4px 4px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); }
      #title h2 { margin: 6px 0 28px; font-size: clamp(20px, 3vw, 30px); letter-spacing: 10px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink); }
      #title .press { font-size: 26px; letter-spacing: 3px; animation: blink 1.4s infinite; text-shadow: 2px 2px 0 var(--ink); }
      @keyframes blink { 50% { opacity: 0.3; } }

      #hud { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.6s; z-index: 10; }
      #hud.on { opacity: 1; }
      #radar { position: absolute; left: 28px; bottom: 28px; width: 210px; height: 210px; }
      #street { position: absolute; left: 28px; bottom: 244px; width: 210px; text-align: center; font-size: 22px; letter-spacing: 1px; text-shadow: 2px 2px 0 var(--ink); }
      #street small { display: block; font: italic 15px Georgia, serif; letter-spacing: 0; opacity: 0.85; }
      #clock { position: absolute; right: 30px; top: 22px; font-size: 52px; letter-spacing: 2px; color: #e9e3cf; text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink); }
      #zone { position: absolute; right: 40px; bottom: 40px; font-family: 'Pirata One', serif; font-size: 58px; color: var(--cream); opacity: 0; text-shadow: 3px 3px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink); }
      #zone.show { animation: zone 4s ease forwards; }
      @keyframes zone { 0% { opacity: 0; transform: translateY(10px); } 10%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }

      #help { position: absolute; left: 24px; top: 20px; background: rgba(0, 0, 0, 0.62); border: 2px solid #000; padding: 12px 16px; font-size: 18px; letter-spacing: 1px; line-height: 1.35; max-width: 300px; }
      #help.hidden { display: none; }
      #help h3 { margin: 0 0 6px; color: var(--gold); font-weight: 400; font-size: 22px; }
      #help ol { margin: 6px 0 0; padding: 0; list-style: none; columns: 2; font-size: 16px; }
      #help b { color: var(--gold); font-weight: 400; display: inline-block; width: 14px; }
      #who { margin: 0 auto 26px; display: grid; gap: 10px; justify-items: center; cursor: default; }
      #who input { font: inherit; font-size: 28px; letter-spacing: 2px; text-align: center; width: 280px; padding: 6px 10px; background: rgba(0,0,0,0.6); color: var(--cream); border: 2px solid #000; outline: none; }
      #who input:focus { border-color: var(--gold); }
      #who label { font-size: 16px; letter-spacing: 3px; color: var(--gold); text-shadow: 2px 2px 0 var(--ink); }
      #shirts { display: flex; gap: 8px; }
      #shirts button { width: 30px; height: 30px; border: 2px solid #000; cursor: pointer; padding: 0; }
      #shirts button.on { outline: 3px solid var(--cream); }

      #chat { position: absolute; left: 28px; bottom: 280px; width: min(380px, 70vw); font: 15px/1.35 system-ui, sans-serif; text-shadow: 1px 1px 0 #000, 0 0 3px #000; }
      #chat .line { opacity: 1; transition: opacity 1s; overflow-wrap: anywhere; }
      #chat .line.old { opacity: 0; }
      #chat.open .line.old { opacity: 0.85; }
      #chat .sys { color: #d8cfb8; font-style: italic; }
      #chat b { font-weight: 700; }
      #chat-in { display: none; pointer-events: auto; width: 100%; margin-top: 4px; font: 15px system-ui, sans-serif; padding: 6px 8px; background: rgba(0,0,0,0.7); color: #fff; border: 2px solid var(--gold); outline: none; }
      #chat.open #chat-in { display: block; }
      #online { position: absolute; right: 32px; top: 84px; font-size: 20px; letter-spacing: 1px; text-shadow: 2px 2px 0 var(--ink); color: #cfe8c4; }
      #online.off { color: #b9a99a; }
      #chat-btn { display: none; position: absolute; left: 14px; top: 14px; pointer-events: auto; font: inherit; font-size: 20px; padding: 4px 12px; background: rgba(0,0,0,0.6); color: var(--cream); border: 2px solid #000; }
      #fps { position: absolute; right: 12px; bottom: 6px; font: 11px/1 ui-monospace, monospace; opacity: 0.5; }
      #credit { position: absolute; right: 12px; bottom: 20px; font: 11px/1 system-ui, sans-serif; opacity: 0.7; text-shadow: 1px 1px 0 #000; }
      #credit a { color: inherit; }
      #hud a { pointer-events: auto; }

      @media (max-width: 700px) {
        #radar { width: 130px; height: 130px; left: auto; right: 14px; bottom: auto; top: 70px; }
        #street { left: auto; right: 14px; top: 204px; bottom: auto; width: 130px; font-size: 16px; }
        #clock { font-size: 34px; right: 16px; top: 16px; }
        #zone { font-size: 38px; right: 16px; bottom: 30px; }
        #help { display: none; }
        #chat { left: 14px; bottom: 90px; }
        #online { right: 16px; top: 56px; font-size: 16px; }
        #chat-btn { display: block; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="grade"></div>

    <div id="hud">
      <canvas id="radar" width="210" height="210"></canvas>
      <div id="street"></div>
      <div id="clock">19:30</div>
      <div id="zone"></div>
      <div id="help">
        <h3>Controls</h3>
        WASD move · Shift sprint · Space jump<br />
        Mouse look (click to lock) · Wheel zoom<br />
        Q / E turn camera · T skip time · H hide<br />
        Enter chat
        <h3 style="margin-top: 10px">Fast travel</h3>
        <ol id="travel"></ol>
      </div>
      <div id="online" class="off"></div>
      <div id="chat"><div id="chat-log"></div><input id="chat-in" maxlength="140" placeholder="Say something… (Enter to send, Esc to close)" autocomplete="off" /></div>
      <button id="chat-btn">Chat</button>
      <div id="credit">Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
      <div id="fps"></div>
    </div>

    <div id="title">
      <div>
        <h1>Tribe City</h1>
        <h2>GALWAY</h2>
        <div id="who">
          <label for="nick">Your name</label>
          <input id="nick" maxlength="16" autocomplete="nickname" spellcheck="false" placeholder="Nickname" />
          <div id="shirts"></div>
        </div>
        <div class="press">Click or press Enter</div>
      </div>
    </div>

    <div id="loading"><p id="load-status">Loading…</p></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
